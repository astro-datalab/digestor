[metadata]
name = digestor
version = attr: digestor.__version__
author = Astro Data Lab
author_email = datalab@noirlab.edu
license = MIT License
license_files = LICENSE.rst
url = https://github.com/astro-datalab/digestor
description = Scripts and metadata for loading survey data into the Data Lab database.
long_description = file: README.rst
long_description_content_type = text/x-rst
edit_on_github = True
github_project = astro-datalab/digestor
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Intended Audience :: Science/Research
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering :: Astronomy
    Topic :: System :: Software Distribution
    Topic :: Utilities

[options]
zip_safe = True
packages = find:
include_package_data = True
python_requires = >=3.9
# setup_requires = setuptools_scm
install_requires =
    astropy
    jinja2
    pyyaml
# scripts =
#     bin/shell_script.sh

[options.entry_points]
console_scripts =
    sdss2dl = digestor.sdss:main
    add_view_metadata = digestor.view:main

[options.extras_require]
test =
    pytest
coverage =
    pytest-cov
    coveralls
doc =
    Sphinx
    sphinx-rtd-theme>1.2

[options.package_data]
digestor =
    data/*
    templates/*
# digestor.test = t/*

[options.packages.find]
exclude = .github/*

[coverage:run]
relative_files = True
source = digestor
omit =
    digestor/_version.py
    digestor/test/*
    digestor/*/test/*
    digestor/*/*/test/*

# [coverage:paths]
# source =
#     digestor
#     */site-packages/digestor/

[coverage:report]
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about packages we have installed
    except ImportError
    # Don't complain if tests don't hit assertions
    raise AssertionError
    raise NotImplementedError
    # Don't complain about script hooks
    def main\(.*\):
    # Ignore branches that don't pertain to this version of Python
    pragma: py{ignore_python_version}
    # Don't complain about IPython completion helper
    def _ipython_key_completions_

[pycodestyle]
# See https://pycodestyle.readthedocs.io/en/latest/intro.html#configuration
# for details of these configuration options.
#
# These are normally ignored by default:
# ignore = E121, E123, E126, E133, E226, E241, E242, E704, W503, W504
#
# These are the explicitly ignored styles:
# - W504: line break after binary operator
#
# This one is not ignored, but modified by max-line-length.
# - E501: line too long (82 > 79 characters)
max-line-length = 150
ignore = W504
